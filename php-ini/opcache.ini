; OPcache — menyimpan bytecode PHP hasil kompilasi di shared memory.
;
; Tanpa ini setiap request HTTP mem-parsing dan mengompilasi ulang seluruh
; framework dari source. Pada mesin ini biayanya ~330 ms per request: file
; statis dilayani 3 ms, sedangkan endpoint PHP yang hanya menjalankan dua
; query terindeks dan mengembalikan body kosong tetap memakan 340 ms.
;
; enable_cli WAJIB 1: `php artisan serve` menjalankan web server bawaan PHP
; lewat SAPI CLI, jadi opcache.enable saja tidak pernah berlaku untuk
; pengembangan lokal.
zend_extension=php_opcache.dll

opcache.enable=1
opcache.enable_cli=1

opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=30000

; Invalidasi yang aman untuk pengembangan: setiap request tetap memeriksa
; timestamp file dan mengompilasi ulang begitu file berubah di disk, sehingga
; hasil edit langsung terlihat tanpa restart. Di server produksi yang
; me-restart PHP saat deploy, revalidate_freq boleh dinaikkan.
opcache.validate_timestamps=1
opcache.revalidate_freq=0

; Laravel dan sebagian paketnya membaca docblock lewat reflection.
opcache.save_comments=1
